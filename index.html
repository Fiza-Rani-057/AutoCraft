<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCraft Detailing - Navbar</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Ambient Background Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Glassmorphic Navbar -->
    <header class="navbar-header">
        <nav class="navbar">
            <!-- Logo Section -->
            <a href="#" class="nav-logo">
                <img src="Images/logo-img-removebg-preview.png" alt="AutoCraft Detailing Logo" class="logo-img">
            </a>

            <!-- Navigation Links -->
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item"><a href="#home" class="nav-link active">Home</a></li>
                <li class="nav-item"><a href="#services" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="#about" class="nav-link">About Us</a></li>
                <li class="nav-item"><a href="#Testominals" class="nav-link">Testominals</a></li>
                <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>

                <!-- Mobile View Button (Drop-down Menu ke andar) -->
                <li class="nav-item mobile-btn-item">
                    <a href="#booking" class="btn-appointment">
                        <div class="wrap">
                            <p>BOOK APPOINTMENT</p>
                        </div>
                    </a>
                </li>
            </ul>

            <!-- Desktop View Button Section -->
            <div class="nav-actions">
                <a href="#booking" class="btn-appointment desktop-btn">
                    <div class="wrap">
                        <p>BOOK APPOINTMENT</p>
                    </div>
                </a>

                <!-- Mobile Menu Toggle Button -->
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <script>
        const mobileToggle = document.getElementById('mobileToggle');
        const navMenu = document.getElementById('navMenu');

        mobileToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            const icon = mobileToggle.querySelector('i');
            if (navMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>
</body>

</html>
