<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCraft Detailing Navbar</title>

    <!-- Google Font: Rajdhani & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Navbar Header -->
    <header class="navbar-header">
        <div class="navbar-container">

            <!-- Logo Image Section -->
            <a href="#home" class="logo-wrapper">
                <img src="Images/logo img.jpg" alt="AutoCraft Detailing Logo" class="navbar-logo">
            </a>

            <!-- Navigation Links -->
            <nav class="nav-links">
                <a href="#home" class="nav-item active">HOME</a>
                <a href="#services" class="nav-item">SERVICES</a>
                <a href="#about" class="nav-item">ABOUT</a>
                <a href="#booking" class="nav-item">BOOKING</a>
                <a href="#testimonials" class="nav-item">TESTIMONIALS</a>
            </nav>
            <!-- Right Action Area  -->
            <div class="nav-right">
                <a href="tel:5551234567" class="phone-link">
                    <i class="fa-solid fa-phone"></i>
                    <span>(555) 123-4567</span>
                </a>
                <a href="#booking" class="btn-appointment">
                    <div class="wrap">
                        <p>
                            BOOK APPOINTMENT
                        </p>
                    </div>
                </a>
            </div>
        </div>
    </header>

</body>

</html>
